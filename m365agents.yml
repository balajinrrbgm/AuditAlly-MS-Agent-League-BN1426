# yaml-language-server: $schema=https://aka.ms/teams-toolkit/v1.7/yaml.schema.json
#
# Microsoft 365 Agents Toolkit (ATK) lifecycle for AuditAlly.
# Provisions a Microsoft Entra app + OAuth registration, builds the app package,
# and publishes the declarative agent to Microsoft 365 Copilot.
version: v1.7

environmentFolderPath: ./env

provision:
  # 1) Microsoft Entra ID app registration for OAuth (MCP server + plugin auth).
  - uses: aadApp/create
    with:
      name: AuditAlly-${{TEAMSFX_ENV}}
      generateClientSecret: true
      signInAudience: AzureADMyOrg
    writeToEnvironmentFile:
      clientId: ENTRA_CLIENT_ID
      clientSecret: SECRET_ENTRA_CLIENT_SECRET
      objectId: ENTRA_OBJECT_ID
      tenantId: ENTRA_TENANT_ID
      authority: ENTRA_AUTHORITY

  # 2) Register the OAuth client in Copilot's plugin vault so the agent can
  #    call the AuditAlly API on the signed-in user's behalf (least privilege).
  - uses: oauth/register
    with:
      name: AuditAlly
      flow: authorizationCode
      appId: ${{TEAMS_APP_ID}}
      clientId: ${{ENTRA_CLIENT_ID}}
      clientSecret: ${{SECRET_ENTRA_CLIENT_SECRET}}
      identityProvider: MicrosoftEntra
      scopes:
        - AuditAlly.Read
        - AuditAlly.Write
      apiSpecPath: ./appPackage/apiSpecificationFile/openapi.json
    writeToEnvironmentFile:
      configurationId: OAUTH2_REGISTRATION_ID

  # 3) Create / update the Teams + Copilot app registration.
  - uses: teamsApp/create
    with:
      name: AuditAlly-${{TEAMSFX_ENV}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

deploy:
  - uses: cli/runNpmCommand
    with:
      args: install
  - uses: cli/runNpmCommand
    with:
      args: run build

publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
